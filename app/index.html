<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Partyfon · Кабинет</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23E7172B'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23fff'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23E7172B'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#FCFCFC;--card:#FFFFFF;--sunk:#F6F6F7;--hover:#F4F4F5;
  --fg:#262633;--text:#494F5C;--mutedfg:rgba(73,79,92,.5);--ph:rgba(73,79,92,.3);--icon:rgba(73,79,92,.6);
  --border:rgba(73,79,92,.1);--input:rgba(73,79,92,.18);--ring:#5961FF;--brand:#5961FF;--brand-soft:rgba(89,97,255,.08);
  --primary:#0E0E0F;--danger:#D93A2B;--danger-soft:#FDF2F1;--warn:#E65C29;--warn-soft:rgba(230,92,41,.1);--ok:#2FA35B;--ok-soft:rgba(47,163,91,.1);
  --sh-raised:0 1px 2px rgba(20,22,30,.08);--sh-pop:0 2px 6px rgba(73,79,92,.1);--sh-modal:0 8px 24px rgba(73,79,92,.14);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro",system-ui,"Segoe UI",Roboto,sans-serif;
  --d-sales:#E5822A;--d-marketing:#D9577A;--d-pm:#5A57D6;--d-design:#8A4DC4;--d-production:#2F6FEB;--d-event:#0A97C2;--d-people:#119E8D;--d-warehouse:#46788C;--d-logistics:#7A8A2C;--d-suppliers:#A57A43;--d-service:#C24E3B;--d-finance:#2C9A58;--d-management:#2A2E37;--d-data:#6C7790;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.45 var(--font);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:var(--fg)}
[hidden]{display:none!important}
h1,h2,h3{margin:0;font-weight:500;color:var(--fg)}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- login ---------- */
#login{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:50}
.lg{width:360px;max-width:calc(100vw - 32px);background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px 28px 24px;box-shadow:var(--sh-modal)}
.lg img{height:18px;display:block;margin-bottom:22px}
.lg h1{font-size:20px;margin-bottom:4px}
.lg p{margin:0 0 20px;color:var(--mutedfg)}
.fld{display:block;margin-bottom:12px}
.fld span{display:block;font-size:12px;color:var(--mutedfg);margin-bottom:5px}
.fld input{width:100%;height:36px;border:1px solid var(--input);border-radius:999px;padding:0 14px;background:var(--card);outline:0}
.fld input:focus{border-color:var(--ring);box-shadow:0 0 0 3px var(--brand-soft)}
.err{color:var(--danger);font-size:12px;min-height:16px;margin:2px 0 8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 16px;border-radius:999px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.btn.pri{background:var(--primary);color:#fff}
.btn.pri:hover{background:rgba(14,14,15,.85)}
.btn.sec{background:var(--card);border-color:var(--input);color:var(--fg)}
.btn.sec:hover{background:var(--hover)}
.btn.ghost{color:var(--text)} .btn.ghost:hover{background:var(--hover)}
.btn.sm{height:30px;padding:0 12px;font-size:12px}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.lg .hint{margin-top:16px;font-size:12px;color:var(--mutedfg);text-align:center}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);height:100%}
.side{border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px 12px;background:var(--bg)}
.side .logo{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.side .logo img{height:15px}
.side .logo b{font-weight:500;color:var(--mutedfg);font-size:12px;border-left:1px solid var(--border);padding-left:10px;line-height:1}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:10px;color:var(--text);font-weight:500}
.nav a svg{color:var(--icon)}
.nav a:hover{background:var(--hover)}
.nav a.on{background:rgba(73,79,92,.06);color:var(--fg)} .nav a.on svg{color:var(--fg)}
.nav a .n{margin-left:auto;font-size:11px;color:var(--mutedfg);background:var(--sunk);border-radius:999px;padding:1px 7px;font-weight:400}
.nav a .n.red{background:var(--danger-soft);color:var(--danger)}
.side .grp{font-size:11px;color:var(--mutedfg);padding:16px 10px 6px;text-transform:none;letter-spacing:0}
.side .me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px}
.side .me:hover{background:var(--hover)}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:500;color:#fff;flex:none;background:var(--c,#6C7790)}
.av.sm{width:22px;height:22px;font-size:10px}
.av.xl{width:40px;height:40px;font-size:14px}
.side .me .t{min-width:0} .side .me .t b{display:block;font-weight:500;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .side .me .t span{font-size:11px;color:var(--mutedfg)}
.side .me button{margin-left:auto;color:var(--icon);width:28px;height:28px;border-radius:8px;display:grid;place-items:center} .side .me button:hover{background:var(--sunk);color:var(--fg)}

.mainc{display:flex;flex-direction:column;min-width:0;height:100%}
.top{display:flex;align-items:center;gap:12px;height:56px;padding:0 24px;border-bottom:1px solid var(--border);flex:none}
.top h1{font-size:20px;margin-right:4px}
.top .sub{color:var(--mutedfg);font-size:12px}
.top .sp{flex:1}
.demo{font-size:11px;color:var(--mutedfg);border:1px dashed var(--input);border-radius:999px;padding:2px 9px}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:2px}
.seg button{height:26px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:500;color:var(--text)}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:var(--sh-raised)}
.srch{display:flex;align-items:center;gap:6px;height:32px;border:1px solid var(--input);border-radius:999px;padding:0 12px;width:240px;background:var(--card)}
.srch svg{color:var(--icon)} .srch input{border:0;outline:0;background:none;width:100%;font-size:13px}
.srch input::placeholder{color:var(--ph)}
.view{flex:1;min-height:0;overflow:auto;padding:20px 24px 32px}
.view.noscroll{overflow:hidden;padding:0}

/* chips / badges */
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;background:rgba(73,79,92,.05);font-size:12px;color:var(--text);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--c,#6C7790)}
.chip.ok{background:var(--ok-soft);color:#1E7A41}
.chip.warn{background:var(--warn-soft);color:#B5461C}
.chip.bad{background:var(--danger-soft);color:var(--danger)}
.chip.brand{background:var(--brand-soft);color:var(--brand)}
.chip.sm{height:18px;font-size:11px;padding:0 7px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{height:28px;padding:0 12px;border-radius:999px;border:1px solid var(--input);font-size:12px;font-weight:500;color:var(--text);display:inline-flex;align-items:center;gap:6px;background:var(--card)}
.fchip:hover{background:var(--hover)} .fchip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.fchip .av{margin-left:-6px}
.fchip.on .av{box-shadow:0 0 0 1.5px #fff}

/* cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:16px}
.card .hd{display:flex;align-items:center;gap:10px;padding:14px 16px 0}
.card .hd h2{font-size:14px} .card .hd .sub{color:var(--mutedfg);font-size:12px} .card .hd .sp{flex:1}
.card .bd{padding:12px 16px 16px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi{padding:16px 18px}
.kpi .l{font-size:12px;color:var(--mutedfg)} .kpi .v{font-size:24px;color:var(--fg);font-weight:500;line-height:1.2;margin:4px 0 2px;font-variant-numeric:tabular-nums} .kpi .s{font-size:12px;color:var(--mutedfg)}
.kpi .s.bad{color:var(--danger)} .kpi .s.ok{color:var(--ok)}

/* lists */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--border);cursor:pointer;min-width:0}
.row:first-child{border-top:0}
.row:hover .t b{color:var(--brand)}
.row .t{min-width:0;flex:1} .row .t b{display:block;font-weight:500;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .row .t span{display:block;font-size:12px;color:var(--mutedfg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;font-size:12px;color:var(--mutedfg);white-space:nowrap} .row .r b{display:block;font-weight:500;color:var(--fg)}
.bar{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--c,var(--brand))}
.hbar{display:grid;grid-template-columns:150px 1fr 40px;align-items:center;gap:10px;padding:5px 0;font-size:12px}
.hbar .n{color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .hbar .v{text-align:right;color:var(--mutedfg);font-variant-numeric:tabular-nums}
.empty{padding:28px 16px;text-align:center;color:var(--mutedfg)}

/* ---------- board ---------- */
.boardwrap{height:100%;display:flex;flex-direction:column}
.bar-f{display:flex;align-items:center;gap:8px;padding:14px 24px 10px;flex-wrap:wrap}
.bar-f .sp{flex:1}
.kan{flex:1;min-height:0;overflow:auto;padding:4px 24px 24px;display:flex;gap:12px;align-items:flex-start}
.col{width:264px;flex:none;background:var(--sunk);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:8px;max-height:100%}
.col .ch{display:flex;align-items:center;gap:8px;padding:6px 8px 2px;position:sticky;top:0}
.col .ch b{font-weight:500;color:var(--fg);font-size:13px} .col .ch i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.col .ch .n{margin-left:auto;font-size:11px;color:var(--mutedfg);font-variant-numeric:tabular-nums} .col .ch .sum{font-size:11px;color:var(--mutedfg)}
.col .cs{display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:40px;padding-bottom:2px}
.col .cs:empty::after{content:'Пусто';display:block;text-align:center;color:var(--ph);font-size:12px;padding:14px 0 10px}
.dc{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px 10px;cursor:pointer;display:flex;flex-direction:column;gap:7px;transition:box-shadow .12s,transform .12s}
.dc:hover{box-shadow:var(--sh-pop);border-color:var(--input)}
.dc.sel{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--brand)}
.dc .ti{font-weight:500;color:var(--fg);line-height:1.3}
.dc .cl{font-size:12px;color:var(--mutedfg);margin-top:-5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dc .st{display:flex;align-items:flex-start;gap:6px;font-size:12px;color:var(--text);line-height:1.35}
.dc .st i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none;margin-top:5px}
.dc .st .br{color:var(--mutedfg)}
.dc .ft{display:flex;align-items:center;gap:6px;margin-top:1px}
.dc .ft .amt{font-size:12px;color:var(--fg);font-variant-numeric:tabular-nums}
.dc .ft .sp{flex:1}
.dc .ft .dt{font-size:11px;color:var(--mutedfg)}
.dc .nx{font-size:12px;color:var(--text);display:flex;gap:6px;align-items:flex-start;line-height:1.35}
.dc .nx svg{color:var(--icon);margin-top:1px}
.dc .nx.bad svg,.dc .nx.bad .d{color:var(--danger)} .dc .nx.today .d{color:var(--warn)}
.dc .nx .d{white-space:nowrap;margin-left:auto;font-variant-numeric:tabular-nums;color:var(--mutedfg)}
.dc .nx span{flex:1}
.dc .lc{display:flex;align-items:center;flex-wrap:wrap;gap:2px 5px;font-size:11px;color:var(--mutedfg);line-height:1.4} .dc .lc svg{width:13px;height:13px;color:var(--icon)} .dc .lc b{font-weight:500;color:var(--text);flex-basis:100%;padding-left:18px}
.cal{overflow:auto}
.cal .ct{min-width:900px;font-size:12px}
.cal .cr{display:grid;grid-template-columns:230px 54px minmax(0,1fr);align-items:center;border-bottom:1px solid var(--border);min-height:38px}
.cal .cr.hd2{min-height:0;padding-bottom:6px;color:var(--mutedfg);font-size:11px}
.cal .wk{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;text-align:center} .cal .wk span{border-left:1px solid var(--border)} .cal .wk span.cur{color:var(--fg)}
.cal .nm{padding-right:12px} .cal .nm b{display:block;font-weight:500;color:var(--fg);white-space:nowrap} .cal .nm span{color:var(--mutedfg);font-size:11px}
.cal .tot{text-align:right;padding-right:12px;color:var(--mutedfg);font-variant-numeric:tabular-nums;white-space:nowrap}
.cal .tl{position:relative;height:38px;min-width:0} .cal .tl.two{height:62px}
.cal .gl{position:absolute;inset:0;display:grid;grid-auto-flow:column;grid-auto-columns:1fr} .cal .gl i{border-left:1px solid var(--border)} .cal .gl i.cur{background:rgba(89,97,255,.05)}
.cal .bk{position:absolute;top:8px;height:22px;border-radius:6px;background:rgba(38,38,51,.78);color:#fff;font-size:11px;line-height:22px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;box-sizing:border-box}
.cal .bk.hold{background:var(--card);border:1px solid rgba(38,38,51,.5);color:var(--fg)} .cal .bk.partner{background:var(--card);border:1px dashed rgba(38,38,51,.5);color:var(--text)} .cal .bk.service{background:var(--danger-soft);color:var(--danger);border:1px solid rgba(217,58,43,.25)}
.cal .bk.r2{top:auto;bottom:8px}
.cal .def{position:absolute;bottom:0;height:3px;background:var(--danger);border-radius:2px}
.cal .today{position:absolute;top:0;bottom:0;width:1px;background:var(--brand);opacity:.6}
.leg2{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:11px;color:var(--mutedfg);margin-top:12px} .leg2 i{display:inline-block;width:14px;height:10px;border-radius:3px;background:rgba(38,38,51,.78);vertical-align:-1px;margin-right:5px} .leg2 i.hold{background:#fff;border:1px solid rgba(38,38,51,.5)} .leg2 i.partner{background:#fff;border:1px dashed rgba(38,38,51,.5)} .leg2 i.service{background:var(--danger-soft);border:1px solid rgba(217,58,43,.25)} .leg2 i.def{height:3px;background:var(--danger);border-radius:2px;vertical-align:2px}
.tech{display:flex;flex-direction:column} .tech .r{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--border);font-size:12px} .tech .r:first-child{border-top:0} .tech .r i{width:8px;height:8px;border-radius:50%;flex:none;margin-top:5px;background:var(--ok)} .tech .r.warn i{background:var(--warn)} .tech .r.bad i{background:var(--danger)} .tech .r b{display:block;font-weight:500;color:var(--fg)} .tech .r span{color:var(--mutedfg)}
/* list view */
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:400;font-size:12px;color:var(--mutedfg);padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr{cursor:pointer} .tbl tbody tr:hover td{background:var(--hover)}
.tbl td b{font-weight:500;color:var(--fg)} .tbl td .mu{color:var(--mutedfg);font-size:12px;display:block}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .w{white-space:nowrap}

/* ---------- deal ---------- */
.dealwrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.dh{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px}
.dh .back{width:32px;height:32px;border-radius:50%;border:1px solid var(--input);display:grid;place-items:center;color:var(--text);flex:none;margin-top:2px}
.dh .back:hover{background:var(--hover)}
.dh h1{font-size:20px;line-height:1.25} .dh .meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;color:var(--mutedfg);font-size:12px;align-items:center}
.dh .meta span{display:inline-flex;align-items:center;gap:5px} .dh .meta svg{width:14px;height:14px;color:var(--icon)}
.dh .acts{margin-left:auto;display:flex;gap:8px;flex:none}
.stepper{padding:6px 16px 14px}
.ph{font-size:11px;color:var(--mutedfg);padding:12px 0 6px 34px}
.ph:first-child{padding-top:4px}
.stp{display:grid;grid-template-columns:24px 1fr;gap:0 10px;position:relative}
.stp .m{position:relative;display:grid;place-items:center;height:100%}
.stp .m::before{content:'';position:absolute;left:11px;top:0;bottom:0;width:2px;background:var(--border)}
.stp:first-of-type .m::before{top:14px} .stp.lastp .m::before{bottom:auto;height:14px}
.stp .m i{width:14px;height:14px;border-radius:50%;background:var(--card);border:2px solid var(--input);position:relative;z-index:1;display:grid;place-items:center}
.stp.done .m i{background:var(--fg);border-color:var(--fg)} .stp.done .m i::after{content:'';width:5px;height:3px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.stp.done .m::before{background:var(--fg)}
.stp.cur .m i{background:var(--brand);border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.stp .c{padding:5px 0 9px;display:flex;align-items:center;gap:8px;min-width:0}
.stp .c .n{font-size:11px;color:var(--mutedfg);width:16px;text-align:right;font-variant-numeric:tabular-nums}
.stp .c .t{color:var(--text)} .stp.done .c .t{color:var(--fg)} .stp.cur .c .t{color:var(--fg);font-weight:500}
.stp .c .d{margin-left:auto;font-size:11px;color:var(--mutedfg);white-space:nowrap}
.stp .c .lane{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.stp .brn{grid-column:2;margin:-4px 0 10px 24px;padding:8px 10px;border-radius:10px;background:var(--warn-soft);font-size:12px;color:#8E3A17;display:flex;gap:8px;align-items:flex-start}
.stp .brn svg{color:var(--warn);width:14px;height:14px;margin-top:1px}
.stp .brn b{font-weight:500;display:block;color:#7A3012}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:13px}
.kv span{color:var(--mutedfg)} .kv b{font-weight:400;color:var(--fg)}
.next{border:1px solid var(--border);border-radius:12px;padding:12px 14px;background:var(--sunk)}
.next .l{font-size:11px;color:var(--mutedfg);margin-bottom:4px}
.next b{font-weight:500;color:var(--fg);display:block;line-height:1.35}
.next .d{font-size:12px;color:var(--mutedfg);margin-top:4px;display:flex;align-items:center;gap:5px}
.next.bad{background:var(--danger-soft);border-color:rgba(217,58,43,.2)} .next.bad .d{color:var(--danger)}
.next.today .d{color:var(--warn)}
.tl{display:flex;flex-direction:column}
.tl .e{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:7px 0;border-top:1px solid var(--border);font-size:12px}
.tl .e:first-child{border-top:0}
.tl .e .d{color:var(--mutedfg);font-variant-numeric:tabular-nums;white-space:nowrap} .tl .e .w{color:var(--text)} .tl .e .w b{font-weight:500;color:var(--fg)} .tl .e .w span{color:var(--mutedfg)}
.docs .row{padding:8px 0} .docs .ic{width:30px;height:30px;border-radius:8px;background:var(--sunk);display:grid;place-items:center;color:var(--icon);flex:none}
.aut{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--border)}
.aut:first-child{border-top:0}
.aut .t{flex:1;min-width:0} .aut .t b{display:block;font-weight:500;color:var(--fg)} .aut .t span{font-size:12px;color:var(--mutedfg);display:block;line-height:1.4}
.sw{width:30px;height:18px;border-radius:999px;background:#DDDEE3;position:relative;flex:none;transition:background .15s;margin-top:2px}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:var(--sh-raised);transition:transform .15s}
.sw.on{background:var(--brand)} .sw.on::after{transform:translateX(12px)}

/* managers */
.mg{padding:16px 18px;cursor:pointer}
.mg:hover{border-color:var(--input);box-shadow:var(--sh-pop)}
.mg .h{display:flex;align-items:center;gap:12px;margin-bottom:12px} .mg .h b{display:block;font-weight:500;color:var(--fg);font-size:14px} .mg .h span{font-size:12px;color:var(--mutedfg)}
.mg .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.mg .nums div{background:var(--sunk);border-radius:10px;padding:8px 10px} .mg .nums b{display:block;font-size:18px;font-weight:500;color:var(--fg);line-height:1.2;font-variant-numeric:tabular-nums} .mg .nums span{font-size:11px;color:var(--mutedfg)}
.mg .nums b.bad{color:var(--danger)}
.mg .leg{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:8px;font-size:11px;color:var(--mutedfg)} .mg .leg i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);margin-right:4px}
.mg .foot{display:flex;gap:14px;margin-top:12px;font-size:12px;color:var(--mutedfg)} .mg .foot b{font-weight:500;color:var(--fg)}

/* attention */
.att .row .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}
.att .row .ic.bad{background:var(--danger-soft);color:var(--danger)} .att .row .ic.warn{background:var(--warn-soft);color:var(--warn)} .att .row .ic.wait{background:var(--brand-soft);color:var(--brand)}

/* map */
.mapf{width:100%;height:100%;border:0;display:block}
.maphint{position:absolute;right:24px;top:70px;z-index:2}

/* toast */
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--primary);color:#fff;border-radius:999px;padding:9px 16px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:60;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* responsive */
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(2,1fr)} .dealwrap{grid-template-columns:1fr}}
@media (max-width:760px){

  .nav{flex-direction:row} .nav a{height:30px;padding:0 10px} .nav a .n{display:none}

  .dh .acts{width:100%;margin-left:0} .dh{flex-wrap:wrap}

const MON=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const fd=d=>`${d.getDate()} ${MON[d.getMonth()]}`;
const fdy=d=>d.getFullYear()===2026?fd(d):`${fd(d)} ${d.getFullYear()}`;
const days=(a,b)=>Math.round((a-b)/864e5);
const money=n=>n.toLocaleString('ru-RU')+' BYN';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ini=n=>n.split(' ').map(w=>w[0]).join('').slice(0,2);
const avatar=(m,cls='')=>`<span class="av ${cls}" style="--c:${MGR[m].c}" title="${esc(MGR[m].n)}">${ini(MGR[m].n)}</span>`;
function mainStep(d){return BR[d.step]?SI[BR[d.step].of]:SI[d.step]}
function stageOf(d){const s=mainStep(d).id;return STAGES.find(st=>st.steps.includes(s))}
function status(d){ // bad / today / wait / ok
  const dd=days(d.due,TODAY);
  if(dd<0)return{k:'bad',l:`Просрочено ${-dd} ${pl(-dd,'день','дня','дней')}`};
  if(['tg','answer','touch'].includes(d.step))return{k:'wait',l:`Ждём клиента ${days(TODAY,d.since)} ${pl(days(TODAY,d.since),'день','дня','дней')}`};
  if(['partner','incomplete','fail','cancel','service'].includes(d.step))return{k:'warn',l:'Вне основного пути'};
  if(dd===0)return{k:'today',l:'Срок сегодня'};
  return{k:'ok',l:'В работе'};
}
const pl=(n,a,b,c)=>{n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1===1)return a;return c};
const rel=d=>{const n=days(TODAY,d);return n===0?'сегодня':n===1?'вчера':fd(d)};
const lastHTML=d=>`<div class="lc">${icon('msg')}<span>${esc(d.last.ch)}</span> · ${rel(d.last.d)} ${d.last.h}${d.expect?`<b>Ответ ждём ${rel(d.expect)==='сегодня'?'сегодня':'к '+fd(d.expect)}</b>`:''}</div>`;
const stepLabel=d=>BR[d.step]?BR[d.step].t:SI[d.step].t;
const icon=k=>`<svg class="i"><use href="#i-${k}"/></svg>`;

  const ms=mainStep(d),br=BR[d.step],st=status(d),stg=stageOf(d);
  setTop('Сделка',d.id.toUpperCase());view.className='view';
  const doneIdx=ms.n-1;
  let steps='';STEPS.forEach((s,i)=>{const ph=PHASES.find(p=>p.at===s.id);if(ph)steps+=`<div class="ph">${ph.n}</div>`;
    const k=i<doneIdx?'done':i===doneIdx?'cur':'';const lastp=PHASES.some((p,pi)=>pi>0&&STEPS[i+1]&&STEPS[i+1].id===p.at)||i===STEPS.length-1;
    const dt=k==='done'?fd(new Date(d.since-(doneIdx-i)*864e5*1.6)):k==='cur'?`с ${fd(d.since)}`:'';
    steps+=`<div class="stp ${k} ${lastp?'lastp':''}"><div class="m"><i></i></div><div class="c"><span class="n">${s.n}</span><span class="lane" style="--c:${hue(s.lane)}"></span><span class="t">${esc(s.t)}</span><span class="d">${dt}</span></div>${k==='cur'&&br?`<div class="brn">${icon('branch')}<div><b>${esc(br.t)}</b>${esc(br.x)}</div></div>`:''}</div>`});
  const hist=[...d.hist].reverse();

function docsFor(d){const ms=mainStep(d);const r=[];if(ms.n>=4)r.push(['Бриф.pdf','заполнен '+fd(new Date(d.since-864e5*3))]);if(ms.n>=7||d.step==='fix')r.push(['КП v1.xlsx',d.step==='fix'?'на пересчёте':'отправлено в Telegram']);if(d.step==='fix'||(ms.n>=8&&d.id==='d02'))r.push(['КП v2.xlsx','правки клиента']);if(ms.n>=9)r.push(['Договор №'+(100+parseInt(d.id.slice(1)))+'.pdf','подписан, аванс 50 %']);if(ms.n>=10)r.push(['Пакет в производство','бриф, площадка, райдер, контакты']);if(ms.n>=18)r.push(['Акт выполненных работ','ожидает подписи']);return r}
function autoFor(d){const s=d.step;const L=[];
  if(['tg','answer','touch'].includes(s))L.push(['Напоминание о касании','Через день после КП без ответа — задача менеджеру, срок виден руководителю продаж',true],['Контакт из Telegram','Переписка менеджера с клиентом подтягивается в сделку: когда и о чём говорили, когда ждём ответ',true]);
  if(['kp','fix'].includes(s))L.push(['Срок на КП: 1 день','По умолчанию день на расчёт, менеджер может сдвинуть срок вручную. Просрочка видна руководителю продаж',true]);
  if(['kp','fix','rider','stock','partner'].includes(s))L.push(['Проверка техники на даты','Перед расчётом Mary сверяет склад с календарём брони: выдача, дорога, монтаж, возврат',true]);
  if(s==='partner')L.push(['Запрос партнёру','Письмо партнёру с составом и датами, ответ — в сделку',true]);
  if(['contract','pack','incomplete'].includes(s))L.push(['Пакет в производство','Собирается из брифа, площадки и райдера. Пустые поля — вернуть с причиной',true]);
  if(['plan','kit','deliv','mount'].includes(s))L.push(['Одно окно на дату','Люди, склад, транспорт и площадка подтверждают готовность к дате',true]);
  if(['event','dism','back','service'].includes(s))L.push(['Приёмка по факту','Чек-лист возврата, дефект сразу уходит в сервис',true]);
  if(['close','stays','dates','again'].includes(s))L.push(['План-факт и обратная связь','Допработы в смету, через 3 дня — вопрос клиенту о впечатлениях',true]);
  L.push(['Повод вернуться','Сезон или 2+ недели без контакта — напоминание менеджеру',false]);
  return L}

function dayOf(x){return Math.floor((x-D(11,2))/864e5)}
function stockDeficits(){const out=[];EQ.forEach(e=>{const by={};BOOK.filter(b=>b.eq===e.id&&b.st!=='partner').forEach(b=>{for(let x=dayOf(b.f);x<=dayOf(b.t);x++)by[x]=(by[x]||0)+b.n});let run=null;Object.keys(by).map(Number).sort((a,b)=>a-b).forEach(x=>{if(by[x]>e.total){if(run&&run.to===x-1)run.to=x;else{run={eq:e,from:x,to:x,over:by[x]-e.total};out.push(run)}}else run=null})});return out}
function rStock(){const WEEKS=9,start=D(11,2),span=WEEKS*7;const defs=stockDeficits();const onRepair=BOOK.filter(b=>b.st==='service').reduce((a,b)=>a+b.n,0);
  const busy=EQ.map(e=>({e,n:BOOK.filter(b=>b.eq===e.id&&b.st!=='partner'&&dayOf(b.f)<=2&&dayOf(b.t)>=2).reduce((a,b)=>a+b.n,0)})).filter(x=>x.n);
  setTop('Склад','занятость техники и выдачи',`<a class="btn ghost sm" href="../#w04" target="_blank">Шаг «Техника на даты» ${icon('ext')}</a>`);view.className='view';
  const rows=EQ.map(e=>{const bs=BOOK.filter(b=>b.eq===e.id).sort((a,b)=>a.f-b.f);let lanes=[[],[]];bs.forEach(b=>{const l=lanes[0].some(o=>!(dayOf(b.t)<dayOf(o.f)||dayOf(b.f)>dayOf(o.t)))?1:0;lanes[l].push(b);b.l=l});const two=lanes[1].length>0;
    const dl=defs.filter(d=>d.eq.id===e.id);
    return `<div class="cr"><div class="nm"><b>${esc(e.n)}</b><span>${e.cat}</span></div><div class="tot">${e.total}</div><div class="tl ${two?'two':''}"><div class="gl">${Array.from({length:WEEKS},(_, i)=>`<i class="${i===0?'cur':''}"></i>`).join('')}</div><div class="today" style="left:${2/span*100}%"></div>
      ${bs.map(b=>{const d=DEALS.find(x=>x.id===b.d);const L=dayOf(b.f)/span*100,W=Math.max((dayOf(b.t)-dayOf(b.f)+1)/span*100,1.2);return `<div class="bk ${b.st} ${b.l?'r2':''}" style="left:${L}%;width:${Math.min(W,100-L)}%" data-id="${b.d}" title="${esc(d.t)} · ${b.n} · ${fd(b.f)}–${fd(b.t)}${b.st==='hold'?' · под КП':b.st==='partner'?' · у партнёра':b.st==='service'?' · на проверке':''}">${b.n} · ${esc(d.t.split(/[,:]/)[0])}</div>`}).join('')}
      ${dl.map(d=>`<div class="def" style="left:${d.from/span*100}%;width:${(d.to-d.from+1)/span*100}%" title="дефицит ${d.over}"></div>`).join('')}</div></div>`}).join('');
  const heads=Array.from({length:WEEKS},(_,i)=>{const d=new Date(start.getTime()+i*7*864e5);return `<span class="${i===0?'cur':''}">${fd(d)}</span>`}).join('');

    <div class="card kpi"><div class="l">Дефицит на 60 дней</div><div class="v" style="color:${defs.length?'var(--danger)':'inherit'}">${defs.length}</div><div class="s ${defs.length?'bad':'ok'}">${defs.length?defs.map(d=>d.eq.n.split(' ')[0]+' '+fd(new Date(start.getTime()+d.from*864e5))+': не хватает '+d.over).join(' · '):'хватает всего'}</div></div>
    <div class="card kpi"><div class="l">На проверке и ремонте</div><div class="v">${onRepair}</div><div class="s">после возврата «Хэллоуин»</div></div>
  </div>
  <div class="card" style="margin-bottom:16px"><div class="hd"><h2>Календарь оборудования</h2><span class="sub">с ${fd(start)} на ${WEEKS} недель · считается не только событие: выдача, дорога, монтаж, возврат</span></div><div class="bd cal"><div class="ct"><div class="cr hd2"><div>Позиция</div><div class="tot">Всего</div><div class="wk">${heads}</div></div>${rows}</div>

  </div>`;

  view.querySelectorAll('.sw').forEach(b=>b.onclick=ev=>{ev.stopPropagation();b.classList.toggle('on');toast(b.classList.contains('on')?'Включено':'Выключено')});
}
function rMap(){setTop('Карта бизнеса','14 отделов · 122 шага · путь клиента',`<a class="btn sec sm" href="../" target="_blank">Открыть отдельно ${icon('ext')}</a>`);view.className='view noscroll';
  view.innerHTML=`<iframe class="mapf" src="../" title="Карта бизнеса Partyfon"></iframe>`}

function rAuto(){setTop('Автоматизации','что Mary берёт на себя на пути клиента');view.className='view';
  const L=[
   ['Запрос → ответственный','Заявка с сайта, звонок или сообщение сразу попадают в сделку и к менеджеру. Руководитель видит время первого ответа.','Продажи',true],
   ['Техника на даты','Перед расчётом Mary сверяет состав со складом и календарём: выдача, дорога, монтаж, возврат. Дефицит → запрос партнёру.','Склад',true],
   ['КП внутри сделки','Расчёт в сделке, а не в отдельном Excel. Версии КП и статус «отправлено / открыто / ответ» видны всем.','Продажи',true],
   ['Срок на КП','По умолчанию один день на расчёт. Менеджер может сдвинуть срок, если договорился с клиентом иначе. Просрочка видна руководителю продаж.','Продажи',true],
   ['Касание после КП','День без ответа — задача менеджеру с датой. Просрочка подсвечивается на доске и в списке «требуют внимания».','Продажи',true],
   ['Контакт из Telegram','Рабочие аккаунты менеджеров подключены к сделкам: последний контакт, краткое содержание и дата ожидаемого ответа видны без вопросов в чате.','Продажи',true],
   ['Пакет в производство','Собирается из брифа, площадки, райдера и контактов. Неполный пакет возвращается продажам с причиной.','Проект',true],
   ['Одно окно на дату','Люди, склад, транспорт и площадка подтверждают готовность к одной дате. Отмена снимает брони.','Производство',true],
   ['Приёмка возврата','Чек-лист по факту. Дефект или недостача уходят в сервис, комплект не теряется.','Склад',false],
   ['План-факт и закрытие','Допработы в смету, остаток оплаты и документы в одной карточке.','Финансы',false],
   ['Повод вернуться','Сезон, важные даты клиента или 2+ недели без контакта → напоминание менеджеру.','Маркетинг',false],
  ];
  view.innerHTML=`<div class="card" style="max-width:860px"><div class="bd" style="padding-top:4px">${L.map(a=>`<div class="aut"><div class="t"><b>${a[0]} <span class="chip sm" style="margin-left:6px">${a[2]}</span></b><span>${a[1]}</span></div><button class="sw ${a[3]?'on':''}"></button></div>`).join('')}</div></div>`;
  view.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{b.classList.toggle('on');toast(b.classList.contains('on')?'Включено':'Выключено')});
}

function updateNav(){document.getElementById('n-deals').textContent=DEALS.length;const ds=stockDeficits().length;const ns=document.getElementById('n-stock');ns.textContent=ds||'';ns.className='n'+(ds?' red':'');ns.hidden=!ds;const a=attention().filter(x=>x.st.k==='bad').length;const el=document.getElementById('n-att');el.textContent=a||'';el.hidden=!a}
function route(){if(!authed())return;const h=location.hash||'#/overview';const [,v,arg]=h.split('/');
  document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v||(v==='deal'&&a.dataset.v==='board')));
  updateNav();
  ({overview:rOverview,board:rBoard,deal:()=>rDeal(arg),managers:rManagers,attention:rAttention,stock:rStock,map:rMap,auto:rAuto}[v]||rOverview)();
  if(!view.classList.contains('noscroll'))view.scrollTop=0;
}
window.addEventListener('hashchange',route);
if(authed())showApp();else{document.getElementById('lu').focus()}
</script>
